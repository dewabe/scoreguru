{% extends "base.html" %}
{% load i18n %}

{% block content %}
<h2>{% trans "Create an Account" %}</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% trans "Sign Up" %}</button>
</form>
<p>{% trans "Already have an account?" %} <a href="{% url 'login' %}">{% trans "Login here" %}</a></p>
{% for message in messages %}
    <p style="color: green;">{{ message }}</p>
{% endfor %}
{% endblock %}
