{% extends "base.html" %}
{% load i18n %}

{% block content %}
    <h2>{% trans "Password Change" %}</h2>
    <p>{% trans "Please enter your current password and the new password twice to confirm." %}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% trans "Change Password" %}</button>
    </form>
{% endblock %}
